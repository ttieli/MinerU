services:
  # 完整版MinerU服务（高效构建）
  mineru-full:
    build:
      context: ../..
      dockerfile: docker/m1-mac-full/Dockerfile-efficient
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VERSION: ${VERSION:-2.0-full-efficient}
    
    image: mineru-m1-full-efficient:${VERSION:-latest}
    container_name: mineru-full-api
    hostname: mineru-full
    restart: unless-stopped
    
    # 端口映射 - 避免与简化版冲突
    ports:
      - "${API_PORT:-8001}:8000"     # API服务端口（外部8001，内部8000）
    
    # 环境变量配置（启用完整版功能）
    environment:
      # 模型源配置
      - MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-huggingface}
      
      # 设备配置
      - DEVICE_MODE=${DEVICE_MODE:-mps}
      - MPS_MEMORY_LIMIT=${MPS_MEMORY_LIMIT:-8G}
      - PYTORCH_ENABLE_MPS_FALLBACK=1
      - PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.0
      - MPS_MEMORY_FRACTION=${MPS_MEMORY_FRACTION:-0.8}
      
      # 功能开关（启用完整版功能）
      - ENABLE_VLM=${ENABLE_VLM:-true}
      - ENABLE_PIPELINE=${ENABLE_PIPELINE:-true}
      - ENABLE_TABLE=${ENABLE_TABLE:-true}
      - ENABLE_FORMULA=${ENABLE_FORMULA:-true}
      - ENABLE_LLM_AIDED=${ENABLE_LLM_AIDED:-false}
      - ENABLE_WEBUI=${ENABLE_WEBUI:-false}
      
      # 性能配置
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - BATCH_SIZE=${BATCH_SIZE:-2}
      - MEMORY_LIMIT=${MEMORY_LIMIT:-8G}
      - MODEL_PRECISION=${MODEL_PRECISION:-fp16}
      - WORKER_PROCESSES=${WORKER_PROCESSES:-4}
      - WORKER_THREADS=${WORKER_THREADS:-2}
      - QUEUE_MAX_SIZE=${QUEUE_MAX_SIZE:-100}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-300}
      
      # 内存优化
      - MEMORY_EFFICIENT_MODE=${MEMORY_EFFICIENT_MODE:-true}
      - MODEL_OFFLOAD_CPU=${MODEL_OFFLOAD_CPU:-true}
      - CLEAR_CACHE_INTERVAL=${CLEAR_CACHE_INTERVAL:-100}
      - ADAPTIVE_BATCH_SIZE=${ADAPTIVE_BATCH_SIZE:-true}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-4}
      
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      
      # Python路径
      - PYTHONPATH=/app
    
    # 数据卷映射（使用不同的输出目录避免冲突）
    volumes:
      # 模型持久化存储（与简化版共享以节省空间）
      - mineru_models_shared:/opt/models
      - mineru_layoutreader_shared:/opt/layoutreader
      
      # 完整版专用缓存和日志
      - mineru_cache_full:/app/cache
      - mineru_logs_full:/app/logs
      
      # 输出目录
      - ./output-full:/app/output
      - ./temp-full:/app/temp
      
      # 配置文件（可选挂载自定义配置）
      - ./config-full:/app/config:ro
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-16G}
          cpus: '${CPU_LIMIT:-8.0}'
        reservations:
          memory: ${MEMORY_RESERVATION:-8G}
          cpus: '${CPU_RESERVATION:-4.0}'
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    
    # 网络配置（使用独立网络避免冲突）
    networks:
      - mineru-full-network
    
    # 系统配置
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    
    # 安全配置
    security_opt:
      - no-new-privileges:true
    
    # 标签
    labels:
      - "com.mineru.service=api-full-efficient"
      - "com.mineru.version=${VERSION:-2.0-full-efficient}"

# 数据卷定义
volumes:
  # 共享模型存储（节省磁盘空间）
  mineru_models_shared:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODELS_PATH:-./models-shared}
  
  mineru_layoutreader_shared:
    driver: local
  
  # 完整版专用缓存和日志
  mineru_cache_full:
    driver: local
  
  mineru_logs_full:
    driver: local

# 网络配置（独立网络避免冲突）
networks:
  mineru-full-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16  # 不同的子网避免冲突